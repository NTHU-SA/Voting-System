name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run tests
        run: npm test

  docker-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare production env file for compose
        run: cp .env.production.example .env.production

      - name: Build and start containers
        run: docker compose --env-file .env.production up -d --build

      - name: Wait for app readiness and smoke test
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/api/activities > /tmp/activities.json; then
              echo "Smoke test response:"
              cat /tmp/activities.json
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          docker compose --env-file .env.production logs --tail=200
          exit 1

      - name: Show container logs
        if: always()
        run: docker compose --env-file .env.production logs --tail=200

      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.production down -v
