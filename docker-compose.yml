version: "3.8"

services:
  db:
    image: mongo:7.0
    container_name: voting-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-voting_sa}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-password}@localhost:27017/admin --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting-app
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-password}@db:27017/${MONGO_INITDB_DATABASE:-voting_sa}?authSource=admin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Mount data files that may be updated
      - ./data:/app/data:ro

volumes:
  mongo_data:
