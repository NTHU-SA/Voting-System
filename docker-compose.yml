services:
  db:
    image: mongo:7.0
    container_name: voting-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@localhost:27017/admin --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      APP_HOSTNAME: ${APP_HOSTNAME:?APP_HOSTNAME is required}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-}

      # JWT
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is required}
      ROOT_ADMIN: ${ROOT_ADMIN} 

      # OAuth
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?OAUTH_CLIENT_ID is required}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?OAUTH_CLIENT_SECRET is required}
      OAUTH_AUTHORIZE: ${OAUTH_AUTHORIZE:?OAUTH_AUTHORIZE is required}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:?OAUTH_TOKEN_URL is required}
      OAUTH_RESOURCE_URL: ${OAUTH_RESOURCE_URL:?OAUTH_RESOURCE_URL is required}
      OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL:?OAUTH_CALLBACK_URL is required}
      OAUTH_SCOPE: ${OAUTH_SCOPE:?OAUTH_SCOPE is required}

      # MongoDB (prefer MONGODB_URI for managed/external DB)
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@db:27017/${MONGO_DATABASE}?authSource=admin}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Mount data files that may be updated
      - ./data:/app/data:ro

volumes:
  mongo_data:
